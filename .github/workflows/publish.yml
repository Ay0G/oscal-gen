name: Publish to PyPI

# Publishing works either way -- pick one:
#
#   Trusted Publishing (no secret, preferred)
#     On pypi.org: Manage -> Publishing -> add a new publisher -> GitHub, with
#       Owner:            Ay0G
#       Repository:       oscal-gen
#       Workflow name:    publish.yml
#       (leave Environment blank unless the job below declares one)
#
#   API token (fallback)
#     Create a token at pypi.org/manage/account/token/ scoped to this project,
#     then add it as the repo secret PYPI_API_TOKEN. If that secret exists the
#     upload step uses it; otherwise the step falls back to OIDC.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/oscal-gen

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build
        run: python -m build

      - name: Check package metadata
        run: twine check --strict dist/*

      - name: Upload to PyPI
        env:
          # Empty credentials make twine fall back to Trusted Publishing.
          TWINE_USERNAME: ${{ secrets.PYPI_API_TOKEN && '__token__' || '' }}
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --non-interactive dist/*

      - name: Confirm the release is live
        run: |
          python - <<'PY'
          import json, re, sys, time, urllib.request, pathlib
          want = re.search(r'^version\s*=\s*"([^"]+)"',
                           pathlib.Path("pyproject.toml").read_text(), re.M).group(1)
          print(f"waiting for oscal-gen {want} on PyPI")
          for attempt in range(12):
              try:
                  with urllib.request.urlopen("https://pypi.org/pypi/oscal-gen/json") as r:
                      if want in json.load(r)["releases"]:
                          print(f"live: https://pypi.org/project/oscal-gen/{want}/")
                          sys.exit(0)
                  print(f"attempt {attempt + 1}: not indexed yet")
              except Exception as exc:
                  print(f"attempt {attempt + 1}: {exc}")
              time.sleep(15)
          sys.exit(f"oscal-gen {want} never appeared on PyPI")
          PY