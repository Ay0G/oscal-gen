name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff build

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest

      - name: Build
        run: python -m build

  # Schema validation is optional: it needs the external oscal-cli binary,
  # which is not available on stock runners. This job proves the generator
  # still produces byte-identical output, which is the property that matters.
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install pyyaml

      - name: Build twice and require identical output
        run: |
          oscal-gen build examples/payments-platform.yaml -o out-a --now 2026-01-01T00:00:00Z --skip-validate
          oscal-gen build examples/payments-platform.yaml -o out-b --now 2026-01-01T00:00:00Z --skip-validate
          diff -r out-a out-b
          echo "deterministic output confirmed"