[project]
name = "oscal-gen"
version = "0.1.0"
description = "Generate OSCAL component-definition, system-security-plan and POA&M documents from a friendly YAML file."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ayog", email = "ayogbug@gmail.com" }]
maintainers = [{ name = "Ayog", email = "ayogbug@gmail.com" }]
keywords = ["oscal", "nist", "compliance", "grc", "security", "ato", "poam", "ssp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Code Generators",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/Ay0G/oscal-gen"
Repository = "https://github.com/Ay0G/oscal-gen"
Issues = "https://github.com/Ay0G/oscal-gen/issues"

[project.scripts]
oscal-gen = "oscalgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oscalgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG", "RUF"]

[tool.ruff.lint.per-file-ignores]
# These tests deliberately pass naive datetimes to check we handle them.
"tests/*" = ["DTZ001"]