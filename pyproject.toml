[project]
name = "oscal-gen"
version = "0.1.0"
description = "Generate OSCAL component-definition, system-security-plan and POA&M documents from a friendly YAML file."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["PyYAML>=6.0"]

[project.scripts]
oscal-gen = "oscalgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oscalgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG", "RUF"]

[tool.ruff.lint.per-file-ignores]
# These tests deliberately pass naive datetimes to check we handle them.
"tests/*" = ["DTZ001"]